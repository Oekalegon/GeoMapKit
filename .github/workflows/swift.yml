name: Swift

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build and Test
    runs-on: macos-26

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build (macOS)
      run: swift build

    - name: Run tests
      run: swift test

    # Every library target must build for all platforms (the Watch is the strictest).
    - name: Build for watchOS
      run: xcodebuild -scheme GeoMapKit-Package -destination 'generic/platform=watchOS' build

    - name: Build for iOS
      run: xcodebuild -scheme GeoMapKit-Package -destination 'generic/platform=iOS' build

    - name: Build tools
      run: swift build --package-path Tools

    - name: Test tools
      run: swift test --package-path Tools

  # The test apps in Apps/ use the package by path: a change in the kit must not break them.
  apps:
    name: Build the apps
    runs-on: macos-26

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    # The project in Apps/ is generated from project.yml and committed: they must agree.
    - name: The committed project is what project.yml generates
      run: Apps/scripts/check-project.sh

    - name: Test the library on the Mac
      run: xcodebuild test -project Apps/GeoMapKitDemo.xcodeproj -scheme GeoMapKitDemo -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO

    - name: Build the app for the iOS Simulator
      run: xcodebuild build -project Apps/GeoMapKitDemo.xcodeproj -scheme GeoMapKitDemo -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO

    - name: Build the Watch app for the Watch Simulator
      run: xcodebuild build -project Apps/GeoMapKitDemo.xcodeproj -scheme GeoMapKitDemoWatch -destination 'generic/platform=watchOS Simulator' CODE_SIGNING_ALLOWED=NO
