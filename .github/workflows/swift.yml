name: Swift

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build and Test
    runs-on: macos-26

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build (macOS)
      run: swift build

    - name: Run tests
      run: swift test

    # Every library target must build for all platforms (the Watch is the strictest).
    - name: Build for watchOS
      run: xcodebuild -scheme GeoMapKit-Package -destination 'generic/platform=watchOS' build

    - name: Build for iOS
      run: xcodebuild -scheme GeoMapKit-Package -destination 'generic/platform=iOS' build
