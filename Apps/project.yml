# The test apps of GeoMapKit. The project is generated: edit this file, then run `xcodegen` in this folder (see README.md).
name: GeoMapKitDemo

options:
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  GeoMapKit:
    path: ..

targets:
  # The map, the library of maps and styles, and (later) the style editor and the Watch transfer: iPhone, iPad and Mac.
  GeoMapKitDemo:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - GeoMapKitDemo
    dependencies:
      - package: GeoMapKit
        product: GeoCore
      - package: GeoMapKit
        product: FeatureStore
      - package: GeoMapKit
        product: MapStyle
      - package: GeoMapKit
        product: MapRender
      - package: GeoMapKit
        product: MapUI
      - target: GeoMapKitDemoWatch
        platformFilter: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_PREFIX).GeoMapKitDemo
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: GeoMapKitDemo/GeoMapKitDemo.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: GeoMapKitDemo/Info.plist
      properties:
        CFBundleDisplayName: GeoMapKit Demo
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: The map shows where you are and can be centred on you.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: org.oekalegon.geomapkit.store
            UTTypeDescription: GeoMapKit feature store
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [gmk]
        CFBundleDocumentTypes:
          - CFBundleTypeName: GeoMapKit feature store
            CFBundleTypeRole: Viewer
            LSItemContentTypes: [org.oekalegon.geomapkit.store]

  # The Watch app: a placeholder in this step; the map and the transfer from the phone come in a later one.
  GeoMapKitDemoWatch:
    type: application
    platform: watchOS
    sources:
      - GeoMapKitDemoWatch
    dependencies:
      - package: GeoMapKit
        product: GeoCore
      - package: GeoMapKit
        product: FeatureStore
      - package: GeoMapKit
        product: MapStyle
      - package: GeoMapKit
        product: MapRender
      - package: GeoMapKit
        product: MapUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_PREFIX).GeoMapKitDemo.watchkitapp
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: GeoMapKitDemoWatch/Info.plist
      properties:
        CFBundleDisplayName: GeoMapKit
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(APP_BUNDLE_PREFIX).GeoMapKitDemo

  GeoMapKitDemoTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - GeoMapKitDemoTests
    dependencies:
      - target: GeoMapKitDemo
      - package: GeoMapKit
        product: MapStyle
      - package: GeoMapKit
        product: FeatureStore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_PREFIX).GeoMapKitDemoTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/GeoMapKitDemo.app/GeoMapKitDemo
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST[sdk=macosx*]: $(BUILT_PRODUCTS_DIR)/GeoMapKitDemo.app/Contents/MacOS/GeoMapKitDemo
        BUNDLE_LOADER[sdk=macosx*]: $(TEST_HOST)

schemes:
  GeoMapKitDemo:
    build:
      targets:
        GeoMapKitDemo: all
    test:
      targets:
        - GeoMapKitDemoTests
  GeoMapKitDemoWatch:
    build:
      targets:
        GeoMapKitDemoWatch: all
